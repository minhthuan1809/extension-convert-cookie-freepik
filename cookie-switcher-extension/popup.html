<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trinh Chuyen Doi Cookie</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo-box">
          <img class="logo" src="download.png" alt="Freepik logo" width="16" height="16" />
        </div>
        <div>
          <h1>Cookie Switcher</h1>
          <p class="brand-sub">Freepik Account Manager</p>
        </div>
      </div>
    </header>

    <section class="card quick-actions">
      <div class="action-grid">
        <button id="capturePushBtn" class="primary" title="Lay cookie va luu len DB">
          <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2 9.5 5H4v16h16V5h-5.5L12 2Zm1 14.5-4-4 1.4-1.4L13 13.2l4.6-4.6L19 10l-6 6.5Z" />
          </svg>
          <span class="btn-text">Lay cookie</span>
        </button>
        <button id="exportBtn" class="secondary" title="Tai file backup DB">
          <span class="btn-text">Export</span>
        </button>
        <button id="importBtn" class="secondary" title="Nhap file backup vao DB">
          <span class="btn-text">Import</span>
        </button>
        <input id="importFile" class="sr-only" type="file" accept="application/json,.json" />
      </div>
    </section>

    <section class="card list-card">
      <div class="section-head">
        <h2>Danh sach ho so</h2>
        <span id="profilesCount" class="count-badge">0 tai khoan</span>
      </div>
      <div id="profiles" class="profiles"></div>
    </section>

    <p id="status" class="status"></p>
  </main>

  <script src="popup.js"></script>
</body>

</html>
